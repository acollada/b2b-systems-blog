name: Publicación Automática Diaria

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  autopost:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Run post generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python generate_post.py

      - name: Verify generated files
        run: |
          echo "=== Estado actual del repositorio ==="
          git status
          echo "=== Archivos en content/posts/ ==="
          ls -la content/posts/ || echo "El directorio no existe"
      - name: Commit and push blog post
        run: |
          git config --global user.name "acollada"
          git config --global user.email "action@github.com"
          git add content/posts/
          git commit -m "auto: nuevo artículo técnico" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main