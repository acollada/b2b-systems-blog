name: Publicación Automática Diaria

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  autopost:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install openai

      - name: Ejecutar script de generación
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PYTHONUNBUFFERED: "1"
        run: python generate_post.py

      - name: Commit and push changes
        run: |
          git config --global user.name "acollada"
          git config --global user.email "avcollada@gmail.com"
          git remote set-url origin https://github.com/acollada/b2b-systems-blog.git
          
          # Crear el directorio si no existe para evitar el error 128
          mkdir -p content/posts/
          
          # Comprobar si hay cambios reales antes de añadir y commitear
          if git status --porcelain | grep -q .; then
            git add content/posts/
            git commit -m "auto: nuevo artículo técnico [skip ci]"
            git push
          else
            echo "No hay cambios nuevos para publicar."
          fi