name: Publicación Automática Diaria

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  autopost:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Test GitHub Models Gateway
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -X POST "https://models.github.ai/inference/v1/chat/completions" \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Content-Type: application/json" \
              -d '{
                "model": "Meta-Llama-3.3-70B-Instruct",
                "messages": [{"role": "user", "content": "Hola"}],
                "max_tokens": 10
              }'
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Run post generator
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python generate_post.py

      - name: Verify generated files
        run: |
          echo "=== Estado actual del repositorio ==="
          git status
          echo "=== Archivos en content/posts/ ==="
          ls -la content/posts/ || echo "El directorio no existe"

      - name: Commit and push changes
        run: |
          git config --global user.name "Bot Automatizado"
          git config --global user.email "bot@users.noreply.github.com"
          
          if git status --porcelain | grep -q .; then
            git add content/posts/
            git commit -m "auto: nuevo artículo técnico [skip ci]"
            git push
          else
            echo "Aviso: No se detectaron cambios pendientes en Git."
          fi