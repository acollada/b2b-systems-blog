name: Publicación Automática Diaria

on:
  schedule:
    - cron: '0 7 * * *' # Se ejecuta diariamente a las 07:00 UTC
  workflow_dispatch:

jobs:
  autopost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install openai

      - name: Ejecutar script de generación
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_post.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "Bot Automatizado"
          git config --global user.email "bot@tusitio.com"
          git add content/posts/
          git commit -m "auto: nuevo artículo técnico [skip ci]" || exit 0
          git push